name: Tests

on:
  pull_request:
  # also build on master so that the Docker layer cache is available to pull requests (tests already ran on the PR)
  push:
    branches: [master]
  # weekly build without cache: the cached TeX Live layer would otherwise hide a new TeX Live release (see TEXLIVE_YEAR
  # in the Dockerfile) until a build without cache, e.g. of a release image, fails
  schedule:
    - cron: '0 4 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pdf-generator:test
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          # only master writes the cache: PRs can read it, and per-PR copies would evict it from the 10 GB cache limit
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Run tests
        if: github.event_name != 'push'
        run: docker run --entrypoint sh pdf-generator:test -c "uv sync --extra dev && uv run pytest"
